<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運動大富翁・全台領地爭霸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/13.2.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#102A43; --muted:#5B6B7C; --line:#D5DDE5;
  --court:#1D5FD0; --court-ink:#FFFFFF; --gain:#1A8F4E; --loss:#C8372D; --warn:#FFF4DE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1720; --surface:#18232F; --ink:#E6EDF3; --muted:#93A4B5; --line:#2A3A4A;
    --court:#2D6BD6; --court-ink:#FFFFFF; --gain:#4CC983; --loss:#F07167; --warn:#3A2E14;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1720; --surface:#18232F; --ink:#E6EDF3; --muted:#93A4B5; --line:#2A3A4A;
  --court:#2D6BD6; --court-ink:#FFFFFF; --gain:#4CC983; --loss:#F07167; --warn:#3A2E14;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--court)}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--court);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--court);color:var(--court-ink);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:#7CF0A8;display:inline-block}
.conn.off i{background:#FFB4A8}
.timer{display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:2px 12px 2px 10px;color:var(--court-ink)}
.timer .num{font-size:24px;line-height:1.1}
.timer small{font-size:12px;opacity:.85}
.timer[disabled]{cursor:default}
.iconbtn{background:transparent;border:0;color:var(--court-ink);font-size:14px;padding:6px 2px;white-space:nowrap}
main{padding:16px 16px 96px;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.team{display:grid;grid-template-columns:10px 1fr auto;align-items:stretch;width:100%;text-align:left;padding:0;margin:0 0 12px;overflow:hidden}
.team .bib{background:var(--c)}
.team .info{padding:12px 14px}
.team .name{font-weight:700;font-size:18px}
.team .meta{color:var(--muted);font-size:13px}
.team .coins{padding:4px 16px 0 0;text-align:right;align-self:center}
.team .coins .num{font-size:56px;line-height:1}
.team .coins small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.neg{color:var(--loss)}
.mine{border-radius:16px;overflow:hidden;margin-bottom:16px;background:var(--surface);border:1px solid var(--line)}
.mine .stripe{height:10px;background:var(--c)}
.mine .body{padding:14px 16px 16px}
.mine .row{display:flex;align-items:flex-end;gap:12px}
.mine .tname{font-size:20px;font-weight:700;flex:1}
.mine .big{font-size:84px;line-height:.9}
.mine .meta{color:var(--muted);font-size:14px;margin-top:6px}
.room{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px}
.room .code{font-size:52px;line-height:1;letter-spacing:.06em}
.room .grow{flex:1}
.hint{color:var(--muted);font-size:14px;margin:4px 0 16px}
.banner{background:var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs button{flex:1;background:none;border:0;padding:12px 0 10px;font-size:15px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--court);font-weight:700;box-shadow:inset 0 3px 0 var(--court)}
.prop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.prop .sq{width:34px;color:var(--muted);font-size:20px}
.prop .pname{flex:1;font-weight:500}
.pprice{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 10px;border-radius:999px;border:1px solid var(--line)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px;align-items:flex-start}
.log time{color:var(--muted);font-size:13px;min-width:44px;padding-top:2px}
.log .who{display:block;color:var(--muted);font-size:12px}
.log .void{text-decoration:line-through;color:var(--muted)}
.log .bad{color:var(--loss);font-size:12px;display:block}
.log .txt{flex:1}
.mini{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:none}
.btn{border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;font-size:16px}
.btn.primary{background:var(--court);color:#fff;border-color:var(--court);font-weight:700}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.block{width:100%;margin-top:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet-head h2{flex:1;margin:0;font-size:19px}
.ghost{background:none;border:0;color:var(--muted);padding:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;min-height:64px}
.act b{font-size:16px}
.act span{font-size:13px;color:var(--muted)}
.act.gain span{color:var(--gain);font-weight:700}
.act.loss span{color:var(--loss);font-weight:700}
.act:disabled{opacity:.45}
.bal{margin:0 0 12px;color:var(--muted)}
.bal .num{font-size:34px;color:var(--ink);vertical-align:-4px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:8px}
.pick .grow{flex:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}
.stepper .num{font-size:48px;min-width:80px;text-align:center}
.stepper .btn{min-width:52px}
.warn{background:var(--warn);border-radius:12px;padding:12px 14px;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:48px}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff;border-color:var(--court)}
label.field{display:block;margin:14px 0 6px;font-weight:500}
input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input.codein{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:40px;font-weight:700;letter-spacing:.2em;text-align:center}
.namerow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.namerow i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;max-width:608px;margin:0 auto}
.toast span{flex:1}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rank .pos{width:28px;font-size:28px}
.rank .grow{flex:1}
.rank .num.total{font-size:32px}
.timeup{background:var(--loss);color:#fff;text-align:center;padding:8px;font-weight:700}
.center{text-align:center;padding:40px 8px;color:var(--muted)}
.hero{padding:28px 4px 8px}
.hero h2{font-size:28px;margin:0 0 6px}
.role{display:block;width:100%;text-align:left;padding:18px 16px;margin-bottom:12px}
.role b{display:block;font-size:19px}
.role span{color:var(--muted);font-size:14px}
.joinbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:16px}
.joinbtn i{width:18px;height:18px;border-radius:50%;background:var(--c);flex:none}
.joinbtn b{flex:1;font-size:18px}
.qr{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:12px;margin:8px 0}
.qr svg{width:min(70vw,280px);height:auto}
.link{word-break:break-all;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.here{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.here .sqn{font-size:30px;line-height:1;color:var(--muted)}
.here b{font-size:18px}
.panel{padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 4px;font-size:15px;color:var(--muted);font-weight:500}
.dest{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.dest .num{font-size:64px;line-height:1;color:var(--court)}
.dest b{font-size:24px}
.bigbtn{width:100%;padding:18px;font-size:19px;border-radius:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:10px 0;width:100%}
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.dice button{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--bg);font-size:44px}
.levels{display:grid;gap:8px;margin:10px 0}
.levels button{display:flex;align-items:center;gap:10px;text-align:left}
.levels .lv{font-weight:700;min-width:28px}
.levels .grow{flex:1}
.taskline{font-size:15px;margin:6px 0 2px}
.cardface{border:2px solid var(--court);border-radius:14px;padding:16px;margin:6px 0 12px}
.cardface .kind{color:var(--court);font-size:13px;font-weight:700}
.cardface b{display:block;font-size:22px;margin:2px 0 6px}
.scanner{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
.scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
.scanner .frame{position:absolute;left:50%;top:42%;width:min(64vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
.scanner .bar{background:#000;color:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
.scanner .bar span{flex:1;font-size:15px}
.scanner .bar button{background:#fff;color:#000;border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.scanner .top{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;color:#fff;text-align:center;font-size:16px;text-shadow:0 1px 3px #000}
.more{margin-top:6px}
select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
.mods{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.warnchip{border-color:var(--loss);color:var(--loss)}
.cardface.pickable{display:block;width:100%;text-align:left;background:var(--surface);cursor:pointer;font:inherit;color:inherit}
.ghostbtn{background:none;border-color:transparent;color:var(--muted)}
.donebtn{margin-top:14px}
.teambtn{display:flex;align-items:center;gap:8px}
.teambtn i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.roles{display:grid;gap:8px}
.rolecard{display:block;text-align:left;padding:12px 14px;width:100%;font:inherit;color:inherit}
.rolecard b{display:block;font-size:17px}
.rolecard[aria-pressed="true"]{border:2px solid var(--court);background:color-mix(in srgb,var(--court) 8%,var(--surface))}
.fncard{padding:12px 14px;margin-bottom:10px}
.fncard b{font-size:17px}
h3.sect{font-size:14px;color:var(--muted);margin:18px 0 8px;font-weight:700}
/* big screen */
body.isbig main{max-width:none}
.bigwrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:12px 16px;height:100vh;box-sizing:border-box}
.mapbox{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.ring{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:3px;height:min(calc(100vh - 24px),100%);aspect-ratio:1;max-width:100%}
.cell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 4px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:inset 0 5px 0 var(--own,transparent)}
.cell .cid{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(9px,1.1vh,13px);color:var(--muted)}
.cell .cn{font-weight:700;font-size:clamp(10px,1.45vh,16px);line-height:1.15}
.cell .own{position:absolute;top:5px;right:4px;font-size:clamp(8px,1vh,12px);color:var(--own)}
.cell.t-start{background:color-mix(in srgb,var(--court) 14%,var(--surface))}
.cell.t-chance{background:color-mix(in srgb,#E07A1F 14%,var(--surface))}
.cell.t-fate{background:color-mix(in srgb,#8A4FD3 14%,var(--surface))}
.cell.t-train,.cell.t-hosp{background:color-mix(in srgb,var(--loss) 12%,var(--surface))}
.cell.t-port,.cell.t-dock{background:color-mix(in srgb,#2BA5B5 16%,var(--surface))}
.cell.t-shop{background:color-mix(in srgb,var(--gain) 12%,var(--surface))}
.toks{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px}
.tok{display:inline-flex;align-items:center;justify-content:center;width:clamp(16px,2.2vh,24px);height:clamp(16px,2.2vh,24px);border-radius:50%;color:#fff;font-size:clamp(9px,1.2vh,13px);font-weight:700;border:1.5px solid #fff;flex:none}
.more{font-size:11px;color:var(--muted)}
.ringcenter{display:flex;flex-direction:column;gap:10px;padding:14px 18px;min-height:0;overflow:hidden}
.brand{font-size:clamp(16px,2.4vh,26px);font-weight:700;color:var(--court)}
.headline{font-size:clamp(18px,3vh,34px);font-weight:700;line-height:1.3;background:var(--surface);border-radius:12px;padding:12px 16px;border:2px solid var(--court)}
.bigfeed{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:clamp(12px,1.7vh,18px)}
.bigfeed li{display:flex;gap:10px}
.bigfeed time{color:var(--muted);min-width:44px}
.bigfeed .k-warn{color:var(--loss)}.bigfeed .k-money{color:var(--gain)}
.islands{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.islname{font-size:clamp(11px,1.4vh,15px);font-weight:700;color:var(--muted);margin-bottom:4px}
.islrow{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;height:clamp(52px,8vh,96px)}
.side{overflow:auto;min-height:0;padding-bottom:12px}
.roomrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.roomcode{font-size:56px;line-height:1;letter-spacing:.06em}
.miniqr{width:110px;background:#fff;border-radius:8px;padding:4px}
.miniqr svg{width:100%;height:auto;display:block}
.bigtimer{margin:10px 0 0;color:var(--ink);border-color:var(--line);width:100%;justify-content:center}
.bigtimer .num{font-size:36px}
.trow{display:grid;grid-template-columns:24px 12px auto 1fr auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.trow i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.trow .pos{font-size:22px}.trow .tt{font-size:26px}
.plist{display:grid;gap:2px}
.prow{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;text-align:left;font:inherit;color:inherit;border-bottom:1px solid var(--line)}
.prow .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeupbig{background:var(--loss);color:#fff;font-weight:700;padding:10px 14px;border-radius:10px;font-size:22px}
@media (max-width:900px){.bigwrap{grid-template-columns:1fr;height:auto}.ring{height:auto;width:100%}}
[hidden]{display:none!important}
.mine .row{align-items:center}
.mine .tname{min-width:0;font-size:20px}
.mine .big{font-size:48px;line-height:1;white-space:nowrap}
.numin{width:130px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.custom{display:flex;align-items:center;gap:8px;margin-top:8px}
.bigwrap2{display:flex;flex-direction:column;height:100vh;box-sizing:border-box;padding:12px 18px;gap:12px}
.bighead{display:flex;align-items:center;gap:20px}
.bighead .brand{flex:1;font-size:28px}
.roombox{display:flex;align-items:center;gap:10px}
.roombox .roomcode{font-size:48px}
.roombox .miniqr{width:84px}
.bighead .bigtimer{width:auto;margin:0;padding:6px 18px}
.bigbody{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr 1fr 0.8fr;gap:16px}
.colA,.colB,.colC{min-height:0;overflow:hidden;display:flex;flex-direction:column}
.colC{overflow:auto}
.spot{background:var(--surface);border:3px solid var(--court);border-radius:18px;padding:18px 22px}
.spot.empty{border-style:dashed}
.spot.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.96);box-shadow:0 0 0 0 color-mix(in srgb,var(--court) 50%,transparent)}60%{transform:scale(1.01);box-shadow:0 0 0 14px transparent}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.spot.pop{animation:none}}
.spottop{display:flex;align-items:center;gap:12px}
.spot .icon{font-size:40px;line-height:1}
.spottitle{font-size:clamp(22px,3.2vh,38px);font-weight:700}
.spotrow{display:flex;align-items:center;gap:18px;margin:14px 0 8px;flex-wrap:wrap}
.arrow{font-size:48px;color:var(--court);font-weight:700}
.tos{display:flex;gap:14px;flex-wrap:wrap}
.av{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px}
.av .tok{width:38px;height:38px;font-size:18px}
.av.lg .tok{width:64px;height:64px;font-size:30px;border-width:3px}
.av.lg b{font-size:20px}
.spottext{font-size:clamp(14px,1.9vh,20px);color:var(--muted)}
.colA .bigfeed{overflow:hidden;font-size:clamp(13px,1.8vh,19px);gap:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .tv{font-size:clamp(26px,4vh,44px);line-height:1.05}
.bar{margin-bottom:10px}

.kings{display:grid;grid-template-columns:1fr 1fr;gap:14px}

@media (max-width:1100px){.bigbody{grid-template-columns:1fr}.bigwrap2{height:auto}}
.bld{display:flex;flex-direction:column;align-items:center;margin:4px 0 6px}

@keyframes sinkout{to{opacity:0;transform:translateY(10px) scale(.95)}}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sparks{position:absolute;left:50%;top:45%;width:0;height:0}

@keyframes spark{0%{opacity:1;transform:rotate(var(--a)) translateX(0)}100%{opacity:0;transform:rotate(var(--a)) translateX(110px)}}
.celebrate{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.55);display:flex;align-items:center;justify-content:center}
.cbox{background:var(--surface);border-radius:20px;padding:20px 26px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.ctitle{font-size:24px;font-weight:700;margin-top:6px}
.spot .bldfx{width:min(30vw,360px);height:min(19vw,225px);margin:6px 0}
@media (prefers-reduced-motion:reduce){.bldfx .old{animation:none;opacity:0}.bldfx .new .b,.bldfx .new,.sparks i{animation:none;opacity:1}.sparks{display:none}}
.bigwrap2.withsim .bigbody{grid-template-columns:1.1fr .9fr .75fr 400px}
.colSim{display:flex;flex-direction:column;min-height:0;gap:8px}
.simtitle{font-weight:700;color:var(--court)}
.colSim select{margin:0}
.simphone{flex:1;min-height:0;overflow:auto;border:10px solid #1f2933;border-radius:28px;background:var(--bg);transform:translateZ(0);position:relative}
.simphone header{position:sticky;top:0}
.simphone nav.tabs{position:fixed}
.simphone .toast{bottom:70px}
.bigwrap2.withsim .bighead .brand{font-size:22px}
.tok.face{background:var(--surface);border:2.5px solid var(--tc);overflow:hidden;padding:0}
.tok.face img{width:100%;height:100%;object-fit:cover;display:block}
.tok.face.me{width:56px;height:56px;border-width:3px;margin-right:10px}
.prow .tok.face,.klist .tok.face{width:34px;height:34px}
.av .tok.face{width:52px;height:52px}
.avfull{height:clamp(110px,17vh,190px);width:auto;border-radius:12px;border:3px solid var(--tc);background:var(--surface)}
.rolecard{display:flex;gap:12px;align-items:center}
.roleart{width:58px;height:auto;border-radius:8px;flex:none}
.roletxt{display:flex;flex-direction:column}

.simphone{scroll-padding-bottom:90px}

/* ===== redesign tokens ===== */
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--ink:#13233A;--muted:#5A6B80;--line:#D6DEE8;
  --court:#1F57C3;--court-ink:#FFFFFF;--ocean:#0E9AA7;--coin:#F2B200;--loss:#D9433B;--gain:#16884A;--warn:#FFF3D1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1622;--surface:#172232;--ink:#E8EEF6;--muted:#97A8BC;--line:#28374A;--court:#4D86F0;--ocean:#2BB8C4;--coin:#F5C534;--loss:#F06A62;--gain:#45C97F;--warn:#3A3115;}}
:root[data-theme="dark"]{--bg:#0E1622;--surface:#172232;--ink:#E8EEF6;--muted:#97A8BC;--line:#28374A;--court:#4D86F0;--ocean:#2BB8C4;--coin:#F5C534;--loss:#F06A62;--gain:#45C97F;--warn:#3A3115;}
body{font-feature-settings:"palt" 1}
header{padding:8px 14px}
header h1{font-size:16px}
.timer .num{font-size:22px}
main.phone{padding:0 0 110px}
/* name strip: flat team band, not a card */
.strip{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:inset 6px 0 0 var(--tc);padding:12px 16px 10px 20px}
.striprow{display:flex;align-items:center;gap:10px}
.striprow .who{flex:1;min-width:0;display:flex;flex-direction:column}
.striprow .who b{font-size:19px;line-height:1.2}
.striprow .who span{font-size:13px;color:var(--muted)}
.strip .cash{font-size:40px;line-height:1;white-space:nowrap}
.striprow.sub{margin-top:8px;justify-content:space-between}
.loc{display:flex;align-items:baseline;gap:6px;font-weight:700}
.loc .num{color:var(--muted);font-size:18px}
.handbtn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}
.strip .tok.face.me{width:48px;height:48px;margin:0}
/* steps: real sequence, numbered */
.steps{list-style:none;display:flex;margin:0;padding:10px 16px;gap:6px}
.steps li{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-bottom:6px;border-bottom:3px solid var(--line)}
.steps li .num{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;background:var(--line);color:var(--ink);font-size:13px}
.steps li.done{border-color:color-mix(in srgb,var(--court) 45%,var(--line))}
.steps li.on{color:var(--ink);font-weight:700;border-color:var(--court)}
.steps li.on .num{background:var(--court);color:#fff}
/* panels: open sections, not stacked cards */
.panel{padding:6px 16px 0}
.ptitle{font-size:22px;margin:6px 0 8px;line-height:1.25}
.evhead{display:flex;flex-direction:column;margin-top:6px}
.evhead .num{color:var(--muted);font-size:16px}
.evhead .ptitle{margin-top:0;font-size:26px}
.taskline{font-size:15px;line-height:1.55}
.warnline{color:var(--loss);font-weight:700;margin:0 0 8px}
.btn{min-height:50px;border-radius:12px}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn.primary{box-shadow:0 2px 0 color-mix(in srgb,var(--court) 60%,#000)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
/* thumb zone: dice sit low, big */
.thumb{margin-top:12px}
.dice{gap:10px}
.dice button{background:var(--surface);border:2px solid var(--line);border-radius:18px;font-size:48px;box-shadow:0 3px 0 var(--line)}
.dice button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.dice.compact button{aspect-ratio:auto;height:68px;font-size:36px}
.next{border-top:1px dashed var(--line);padding-top:10px;margin-top:16px}
.nexthint{margin:0 0 8px;font-weight:700;color:var(--gain)}
.duehint{margin-top:14px}
/* ticket: the one bold element */
.ticket{position:relative;background:linear-gradient(180deg,#E9F3FF,#DCEBFF);color:#13233A;border-radius:14px;padding:12px 16px 14px;margin:6px 0 14px;border:2px solid #9DBDEB;
  -webkit-mask:radial-gradient(circle 9px at 0 58%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 58%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 58%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 58%,#0000 98%,#000) right/51% 100% no-repeat}
.tk-top{display:flex;justify-content:space-between;font-size:12px;color:#40597A;border-bottom:1.5px dashed #9DBDEB;padding-bottom:6px}
.tk-route{display:flex;align-items:center;gap:8px;margin-top:10px}
.tk-st{flex:1;display:flex;flex-direction:column;min-width:0}
.tk-st small{font-size:12px;color:#40597A}
.tk-st b{font-size:20px;line-height:1.2}
.tk-st.to b{font-size:30px;color:#1F57C3}
.tk-st .num{font-size:16px;color:#40597A}
.tk-arrow{font-size:28px;color:#1F57C3}
.ticket .sqart{max-height:120px}
.stamp{position:absolute;right:14px;bottom:12px;transform:rotate(-8deg);border:3px solid currentColor;border-radius:8px;padding:2px 10px;font-weight:900;font-size:16px;background:rgba(255,255,255,.7)}
.stamp.gold{color:#B07D00}.stamp.red{color:#C0392B}
.actionbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 80%,transparent);padding:12px 0 4px;margin-top:6px}
/* cards */
.cardface.big{padding:18px}
.cardface.big b{font-size:26px}
.cardface.chance{border-color:#E07A1F}.cardface.chance .kind{color:#E07A1F}
.cardface.fate{border-color:#8A4FD3}.cardface.fate .kind{color:#8A4FD3}
nav.tabs button{min-height:56px}
/* big screen */
.statstrip{display:flex;gap:26px;padding:4px 0 12px;border-bottom:2px solid var(--line);margin-bottom:6px}
.statstrip .tile{background:none;border:0;padding:0}
.statstrip .tv{font-size:clamp(30px,4.6vh,52px)}
.bigbody .sect{font-size:16px}
.bar .rk{font-size:28px}
.barlbl b{font-size:22px}
.barlbl .bv{font-size:32px}
.track{height:20px}
.spottitle{font-size:clamp(26px,3.8vh,44px)}
.colA .bigfeed{font-size:clamp(14px,2vh,21px)}
.prow{padding:8px 2px}
.prow b{font-size:17px}
.simphone nav.tabs{position:sticky;bottom:0}
.simphone .actionbar{bottom:58px}
.spot{display:flex;flex-wrap:wrap;align-items:center;column-gap:24px}
.spottop,.spottext{width:100%}
.spotbld{flex:1 1 300px;min-width:0}
.spotbld .bldfx,.spotbld .bld.big svg{width:100%;max-width:380px}
.spotbld .bldfx{height:auto;aspect-ratio:160/100}
.spot .spotrow{flex:0 1 auto}
/* ===== sunny palette: sunflower + clear sky + grass, warm ink ===== */
:root{
  --bg:#EEF7FD;--surface:#FFFFFF;--ink:#1F2A37;--muted:#5D6B79;--line:#D3E3EE;
  --sun:#FFC72C;--sun-deep:#E9A800;--sky:#1C8AD3;--court:#1C8AD3;--court-ink:#1F2A37;
  --grass:#2C9B55;--gain:#2C9B55;--loss:#E8513F;--warn:#FFF2C6;--ocean:#13A3B4;--coin:#E9A800;
  --display:"Huninn","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13202C;--surface:#1B2B3A;--ink:#F3F6F9;--muted:#A3B3C2;--line:#2C4052;--sun:#FFC72C;--sun-deep:#F2B705;--sky:#4FB0F0;--court:#4FB0F0;--grass:#4CC57A;--gain:#4CC57A;--loss:#FF7663;--warn:#3D3415;}}
:root[data-theme="dark"]{--bg:#13202C;--surface:#1B2B3A;--ink:#F3F6F9;--muted:#A3B3C2;--line:#2C4052;--sun:#FFC72C;--sun-deep:#F2B705;--sky:#4FB0F0;--court:#4FB0F0;--grass:#4CC57A;--gain:#4CC57A;--loss:#FF7663;--warn:#3D3415;}
body{background:var(--bg) radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--sun) 22%,transparent),transparent 70%) no-repeat}
body::before{background:var(--sun)}
header{background:var(--sun);color:#1F2A37;box-shadow:0 2px 0 var(--sun-deep)}
header h1,.iconbtn,.timer,.conn{color:#1F2A37}
.timer{border-color:rgba(31,42,55,.35)}
.conn i{background:#2C9B55}.conn.off i{background:#E8513F}
header h1,.ptitle,.evhead .ptitle,.brand,.spottitle,.ctitle,.tk-st b,.strip .who b,.hero h2,.selfierow b,.rolecard b,.trow b,.barlbl b{font-family:var(--display)}
.brand{color:#1F2A37}
/* buttons: sunflower with dark ink, sky for secondary emphasis */
.btn.primary{background:var(--sun);color:#1F2A37;border-color:var(--sun-deep);box-shadow:0 3px 0 var(--sun-deep);font-weight:700}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--sun-deep)}
.btn.primary:disabled{box-shadow:none}
.seg button[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
.rolecard[aria-pressed="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 9%,var(--surface))}
nav.tabs button[aria-current="page"]{color:var(--sky);box-shadow:inset 0 3px 0 var(--sky)}
.steps li.on{border-color:var(--sun-deep)}
.steps li.on .num{background:var(--sun);color:#1F2A37}
.steps li.done{border-color:color-mix(in srgb,var(--sun-deep) 45%,var(--line))}
.dice button{border-color:color-mix(in srgb,var(--sun-deep) 35%,var(--line));box-shadow:0 3px 0 color-mix(in srgb,var(--sun-deep) 45%,var(--line))}
.nexthint{color:var(--grass)}
/* ticket: sunny paper with sky print */
.ticket{background:linear-gradient(180deg,#FFF6D5,#FFEDB0);border-color:#F0C24B;color:#3B2F12}
.tk-top{color:#7A6220;border-bottom-color:#E6C25A}
.tk-st small,.tk-st .num{color:#7A6220}
.tk-st.to b,.tk-arrow{color:#1C6FB0}
.stamp.gold{color:#2C9B55}
/* spotlight & big screen */
.spot{border-color:var(--sun-deep);box-shadow:0 6px 0 color-mix(in srgb,var(--sun) 60%,transparent)}
.spot.empty{border-color:var(--line);box-shadow:none}
.headline{border-color:var(--sun-deep)}
.cardface{border-color:var(--sky)}.cardface .kind{color:var(--sky)}
.timeup,.timeupbig{background:var(--loss)}
.bigtimer{background:var(--surface)}
/* faces & selfie */
.tok.face.photo{position:relative;overflow:visible}
.tok.face.photo>img:first-child{border-radius:50%}
.tok.face img.rolebadge{position:absolute;right:-4px;bottom:-4px;width:45%;height:45%;border-radius:50%;border:2px solid var(--surface);object-fit:cover;background:var(--surface)}
.avphoto{width:clamp(110px,16vh,180px);height:clamp(110px,16vh,180px);border-radius:50%;object-fit:cover;border:5px solid var(--tc);background:var(--surface)}
.selfierow{display:flex;gap:14px;align-items:center}
.selfie{width:104px;height:104px;border-radius:50%;border:3px dashed var(--sun-deep);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;background:var(--surface);color:var(--muted);font-size:13px}
.selfie img{width:100%;height:100%;object-fit:cover}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.joinform{padding:12px 16px 100px}
.bigwrap2 .bighead{background:var(--sun);margin:-12px -18px 0;padding:10px 18px;box-shadow:0 3px 0 var(--sun-deep)}
.bigwrap2 .bighead .brand,.bigwrap2 .bighead .pprice,.bigwrap2 .roomcode{color:#1F2A37}
.bigwrap2 .bigtimer{background:rgba(255,255,255,.75)}
.tring{position:relative;width:220px;height:220px;margin:8px auto 0}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .rbg{fill:none;stroke:var(--line);stroke-width:10}
.tring .rfg{fill:none;stroke:var(--sun-deep);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;line-height:1}
.tnum.done{color:var(--grass)}
.tstat{text-align:center;font-weight:700;font-size:18px;margin:8px 0 12px}
.tend{display:grid;gap:8px}
@media (prefers-reduced-motion:reduce){.tring .rfg{transition:none}}
/* counter */
.tgoal{position:absolute;left:0;right:0;bottom:46px;text-align:center;color:var(--muted);font-weight:700}
.tring .rfg.cnt{stroke:var(--grass);transition:stroke-dashoffset .2s ease}
.tapbtn{display:block;width:100%;height:110px;border-radius:22px;border:0;background:var(--sun);color:#1F2A37;font-family:"Barlow Condensed",sans-serif;font-size:64px;font-weight:700;box-shadow:0 5px 0 var(--sun-deep);margin-bottom:4px;touch-action:manipulation}
.tapbtn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sun-deep)}
.tapbtn:disabled{background:var(--grass);color:#fff;box-shadow:none}
/* coin toast */
.toast.coin{background:#FFF4C2;color:#3B2F12;border:2px solid var(--sun-deep);font-weight:700}
/* idle / offline */
.prow.idle{background:color-mix(in srgb,var(--sun) 28%,transparent);border-radius:8px}
.prow.off{background:color-mix(in srgb,var(--loss) 14%,transparent);border-radius:8px}
.prow.off .pprice,.prow.idle .pprice{color:var(--ink)}
/* breaks */
.brk{position:fixed;inset:0;z-index:45;background:rgba(10,128,140,.96);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.brkbox{padding:30px}
.brkicon{font-size:90px}
.brktitle{font-family:var(--display);font-size:clamp(36px,7vh,80px);font-weight:700}
.brkclock{font-size:clamp(70px,16vh,180px);line-height:1}
.brk p{font-size:clamp(16px,2.6vh,28px)}
.brk .btn.primary{margin-top:10px}
.brkbar{background:#0E9AA7;color:#fff;text-align:center;padding:8px;font-weight:700}
.brkbar .num{font-size:20px}
/* awards */
.awards{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 50% 30%,#FFE58A,#FFC72C 55%,#F2A900);color:#1F2A37;text-align:center;padding:24px}
.awbox{max-width:1200px;animation:awin .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes awin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.awbox{animation:none}}
.awtitle{font-family:var(--display);font-size:clamp(44px,9vh,110px);font-weight:700;line-height:1.1}
.awsub{font-size:clamp(20px,3.4vh,40px);margin-top:16px;font-weight:700}
.awfaces{display:flex;flex-wrap:wrap;gap:26px;justify-content:center;margin-top:24px}
.awm{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:22px}
.awm .avphoto{width:clamp(110px,16vh,170px);height:clamp(110px,16vh,170px)}
.awm.big .avphoto{width:clamp(180px,30vh,320px);height:clamp(180px,30vh,320px);border-width:8px}
.awm.big .avfull{height:clamp(220px,36vh,380px)}
.awm.big b{font-size:clamp(28px,5vh,56px)}
.awm .tok.face{width:110px;height:110px}
.awctrl{position:fixed;bottom:24px;right:24px;display:flex;gap:10px;align-items:center}
.awctrl .btn{min-width:120px}
/* big text mode */
body.bigtext main.phone,body.bigtext .joinform,body.bigtext #sheet,body.bigtext nav.tabs{zoom:1.2}
.prow.bot{background:color-mix(in srgb,var(--sky) 10%,transparent);border-radius:8px}
.prow.auto{background:color-mix(in srgb,var(--loss) 22%,transparent);border-radius:8px}
.card.role.resume{border:2px solid var(--sun-deep);background:color-mix(in srgb,var(--sun) 18%,var(--surface))}
.claim{background:var(--warn);border-radius:12px;padding:6px 12px 12px;margin-bottom:12px}
.cloudwarn{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#E8513F;color:#fff;border-radius:12px;padding:10px 16px;margin-top:10px;font-size:16px}
.cloudwarn b{font-size:18px}
.cloudwarn span{flex:1;min-width:200px;opacity:.95}
.cloudwarn .btn.primary{min-height:40px}
/* coach line */
.coach{display:flex;gap:8px;align-items:center;margin:10px 16px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--sun) 30%,var(--surface));font-weight:700;font-size:15px;line-height:1.4}
.coachtag{flex:none;background:#1F2A37;color:#FFC72C;border-radius:6px;padding:2px 8px;font-size:12px}
/* referee */
.refbar{display:flex;align-items:center;gap:10px;margin:8px 12px 0;padding:10px 12px;border-radius:12px;background:#EAF5FF;border:2px solid var(--sky);font-size:14px;color:#1F2A37}
.refbar span{flex:1}
.refbar.on{background:#FFF2C6;border-color:var(--sun-deep)}
.refbar .tok.face{width:36px;height:36px}
.refwho{display:flex;align-items:center;gap:12px;margin:10px 0}
.refwho .tok.face{width:56px;height:56px}
.refwait{font-size:22px}
/* lobby phone / waves */
.checklist{list-style:none;padding:0;margin:8px 0 12px;display:grid;gap:8px}
.checklist li{display:flex;gap:10px;align-items:center;font-size:16px}
.chk{width:24px;height:24px;border-radius:50%;background:var(--grass);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.wave{text-align:center}
.wavenum{font-size:110px;line-height:1;color:var(--sun-deep);margin:10px 0}
/* intro */
.intro{position:fixed;inset:0;z-index:70;background:rgba(15,25,35,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.introbox{background:var(--surface);border-radius:20px;max-width:480px;width:100%;padding:22px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.introbox h2{font-family:var(--display);font-size:28px;margin:4px 0 8px}
.introbox p{font-size:16px;line-height:1.65}
.introstep{color:var(--muted);font-size:16px}
.introart svg{width:200px;height:auto;display:block;margin:6px auto}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun-deep);width:22px;border-radius:4px}
/* lobby big screen */
.lobby{display:flex;flex-direction:column;height:100vh;padding:0 22px 18px;box-sizing:border-box}
.lbhead{display:flex;align-items:center;gap:16px;background:var(--sun);margin:0 -22px;padding:14px 22px;box-shadow:0 3px 0 var(--sun-deep)}
.lbhead .brand{flex:1;font-size:30px;color:#1F2A37}
.lbbody{flex:1;min-height:0;display:grid;grid-template-columns:.9fr 1.3fr 1fr;gap:22px;margin-top:18px}
.lbbody section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;overflow:auto}
.lbbody h2{font-family:var(--display);font-size:clamp(22px,3vh,32px);margin:0 0 10px}
.lbqr{background:#fff;border-radius:12px;padding:8px;width:min(100%,300px);margin:0 auto}
.lbqr svg{width:100%;height:auto;display:block}
.lbcode{text-align:center;font-size:clamp(56px,9vh,96px);letter-spacing:.08em;line-height:1.1}
.lbsteps{font-size:clamp(16px,2.2vh,22px);line-height:1.8;padding-left:1.4em}
.lbteams{display:grid;gap:12px}
.lbteam{border-left:8px solid var(--tc);padding:6px 12px;border-radius:8px;background:color-mix(in srgb,var(--tc) 6%,var(--surface))}
.lbteamname{font-weight:700;font-size:20px;display:flex;justify-content:space-between}
.lbfaces{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.lbp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;width:72px;text-align:center}
.lbp .tok.face{width:58px;height:58px}
.lbctrl{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}
.lbrules p{font-size:clamp(16px,2.3vh,22px);line-height:1.7}
/* start countdown */
.cdown{position:fixed;inset:0;z-index:65;background:rgba(255,199,44,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#1F2A37}
.cdnum{font-size:clamp(140px,40vh,360px);line-height:1}
.cdtxt{font-family:var(--display);font-size:clamp(28px,6vh,60px);font-weight:700}
.refbar .tok.face{width:44px;height:44px;flex:none;border-radius:50%}
.refbar .tok.face>img:first-child{border-radius:50%;object-fit:cover}
</style>
</head>

const START_PASS=2000,START_EXACT=3000,EX_DISCOUNT=100;
const fmt$=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString();
const sqOf=p=>SQ[ROUTES[p.route][p.idx]];
const sqName=id=>`MAP ${id} ${SQ[id].n}`;
const pendId=p=>p.pend?ROUTES[p.pend.route][p.pend.idx]:null;
const teamById=id=>id==='cpu'?CPU:S.cfg.teams.find(t=>t.id===id);
const rentOf=(sq,land)=>sq.r*(land?land.lvl:1);
const invested=(sq,lvl)=>sq.b*lvl*(lvl+1)/2;
function teamCash(tid){return Object.values(S.players).filter(p=>p.team===tid).reduce((a,p)=>a+p.cash,0);}
function teamLand(tid){return Object.entries(S.lands).filter(([,l])=>l.team===tid).reduce((a,[id,l])=>a+invested(SQ[id],l.lvl),0);}
function teamTotal(tid){return teamCash(tid)+teamLand(tid);}
function roleLeft(p){const R=ROLES[p.role];if(!R||!R.lim)return 0;return R.lim-((p.used&&p.used[p.lap])||0);}

function lbl(p){return `${teamById(p.team).name}・${p.name}`;}
function feed(text,kind,to,spot,toMsg){const f={id:(S.fseq=(S.fseq||0)+1),t:Date.now(),text,kind:kind||'',to:to||[]};if(spot)f.spot=spot;if(toMsg)f.toMsg=toMsg;S.feed.unshift(f);if(S.feed.length>80)S.feed.length=80;}
function st(){if(!S.stats)S.stats={ex:{},rent:0,cards:0,buys:0,ups:0,start:0};const s=S.stats;s.paid=s.paid||{};s.recv=s.recv||{};return s;}
function exc(...ps){const s=st();ps.forEach(p=>{if(p&&!p.bot)s.ex[p.id]=(s.ex[p.id]||0)+1;});}
const SP=(title,from,to,icon)=>({title,from:from?from.id:null,to:(to||[]).map(x=>x.id),icon:icon||''});
function others(p){return Object.values(S.players).filter(x=>x.id!==p.id);}
function opps(p){return Object.values(S.players).filter(x=>x.team!==p.team);}
function pay(from,to,amt){if(from)from.cash-=amt;if(to)to.cash+=amt;}
function useRole(p){if(roleLeft(p)<=0)throw new Error(`${ROLES[p.role].n}本圈的技能已用完`);p.used=p.used||{};p.used[p.lap]=(p.used[p.lap]||0)+1;}
function takeFn(p,fn){const i=p.hand.indexOf(fn);if(i<0)throw new Error(`手上沒有「${FN[fn].n}」`);p.hand.splice(i,1);}
function setTarget(p,route,idx,o){o=o||{};p.pend={route,idx,pass:!!o.pass,nobonus:!!o.nobonus,injured:!!o.injured,why:o.why||''};p.ev=null;}
function stepTarget(p,steps){
  const R=ROUTES[p.route];
  if(p.route==='main'){const len=R.length;let i=p.idx+steps;const pass=steps>0&&i>=len;i=((i%len)+len)%len;return {route:'main',idx:i,pass};}
  return {route:p.route,idx:Math.max(0,Math.min(R.length-1,p.idx+steps)),pass:false};
}
function mainIdx(p){return p.route==='main'?p.idx:ROUTES.main.indexOf(ISL[p.route].port);}
function gotoMain(p,targetIdx,o){const from=mainIdx(p);o=o||{};const pass=!o.nobonus&&(targetIdx<from||(targetIdx===0&&from!==0));setTarget(p,'main',targetIdx,{pass,nobonus:o.nobonus,injured:o.injured,why:o.why});}
function nearestAhead(p,test){const from=mainIdx(p),R=ROUTES.main;for(let k=1;k<=R.length;k++){const i=(from+k)%R.length;if(test(SQ[R[i]]))return i;}return null;}
function addStops(p,n,kind){p.stops+=n;p.stopKind=kind||p.stopKind||'ex';if(n>0)p.stopKind=kind||'ex';}

function applyOps(p,ops,ctx){
  for(const op of ops){
    const [k,a,b,c]=op;
    switch(k){
      case 'm':p.cash+=a;break;
      case 'each':others(p).forEach(o=>pay(a>0?o:p,a>0?p:o,Math.abs(a)));break;
      case 'eachOpp':opps(p).forEach(o=>pay(a>0?o:p,a>0?p:o,Math.abs(a)));break;
      case 'poorest':{const os=others(p);if(os.length){const t=os.reduce((m,x)=>x.cash<m.cash?x:m);pay(p,t,a);feed(`${lbl(p)} 付 ${fmt$(a)} 給 ${lbl(t)}`,'money',[t.id],SP(`贊助 ${fmt$(a)}`,p,[t],'🤝'),`💰 ${p.name} 贊助你 ${fmt$(a)}`);}break;}
      case 'perLand':{const n=Object.values(S.lands).filter(l=>l.owner===p.id).length;p.cash+=a*n;break;}
      case 'perLvl2':{const n=Object.values(S.lands).filter(l=>l.owner===p.id&&l.lvl>=2).length;p.cash+=a*n;break;}
      case 'fwd':{const t=stepTarget(p,a);setTarget(p,t.route,t.idx,{pass:t.pass});break;}
      case 'back':{const t=stepTarget(p,-a);setTarget(p,t.route,t.idx);break;}
      case 'goto':gotoMain(p,ROUTES.main.indexOf(a),{nobonus:b==='nobonus'});break;
      case 'gotoType':{const test=a==='arena'?(s=>s.arena):(a==='port'?(s=>s.t==='port'):(a==='func'?(s=>['start','chance','fate','shop'].includes(s.t)):(s=>s.t===a)));const i=nearestAhead(p,test);if(i!==null)gotoMain(p,i);break;}
      case 'hosp':{const i=nearestAhead(p,s=>s.t==='hosp');gotoMain(p,i,{injured:true,nobonus:true});break;}
      case 'gotoLeader':{const os=others(p);if(os.length){const t=os.reduce((m,x)=>x.cash>m.cash?x:m);setTarget(p,t.route,t.idx,{pass:false,why:`跟上 ${t.name}`});}break;}
      case 'gotoFarthest':{const os=others(p);if(os.length){const d=x=>{const a1=mainIdx(p),a2=mainIdx(x),L=ROUTES.main.length;const dd=Math.abs(a1-a2);return Math.min(dd,L-dd)+(x.route!==p.route?3:0);};const t=os.reduce((m,x)=>d(x)>d(m)?x:m);setTarget(p,t.route,t.idx,{why:`跑到 ${t.name} 那一格`});}break;}
      case 'gotoIsland':{const i=nearestAhead(p,s=>s.t==='port');const key=SQ[ROUTES.main[i]].isl;setTarget(p,key,0,{why:`免費搭船去${ISL[key].name}`});break;}
      case 'chooseSq':{const i=ROUTES.main.indexOf(ctx.sq);if(i<0)throw new Error('請選擇目的地');gotoMain(p,i);break;}
      case 'mod':for(let n=0;n<(b||1);n++)p.mods.push(a);break;
      case 'stop':addStops(p,a,'ex');break;
      case 'nobonus':p.nobonusNext=true;break;
      case 'fn':p.hand.push(a);break;
      case 'allOppStop':opps(p).forEach(o=>{addStops(o,a,'ex');});feed(`${lbl(p)} 發動城市馬拉松交管：所有對手各完成 ${a} 張運動卡才能擲骰`,'card',opps(p).map(o=>o.id));break;
      case 'islandStop':Object.values(S.players).filter(o=>o.route!=='main').forEach(o=>addStops(o,a,'ex'));break;
      case 'ifRegion':if(sqOf(p).reg===a)applyOps(p,b,ctx);break;
      case 'ifMtn':if(sqOf(p).mtn)applyOps(p,a,ctx);break;
      case 'tm':{const t=S.players[ctx.target];if(!t)throw new Error('請選擇對手');t.cash+=a;feed(`${lbl(t)} 猜拳贏了，領 ${fmt$(a)}`,'money',[t.id],null,`💰 你猜拳贏了，收到 ${fmt$(a)}`);break;}
    }
  }
}
function needsTarget(card){return card.target==='opp';}

function arriveEffects(p,pe){
  const s=sqOf(p);
  let bonus=0;
  if(p.route==='main'&&pe.route==='main'){
    if(pe.pass||p.idx===0){ if(!pe.nobonus){bonus=p.idx===0?START_EXACT:START_PASS;} p.lap++; }
    if(bonus&&p.nobonusNext){bonus=0;p.nobonusNext=false;feed(`${lbl(p)} 感冒中，這次經過起點不能領錢`,'warn');}
  }
  if(bonus){p.cash+=bonus;st().start++;feed(`${lbl(p)} ${p.idx===0?'剛好停在':'經過'}起點，領 ${fmt$(bonus)}`,'money',[],p.idx===0?SP(`剛好停在起點 +${fmt$(bonus)}`,p,[],'🎯'):null);}
  const ev={sq:s.id};
  if(pe.injured&&s.t==='hosp'){
    ev.hosp=true;
    if(p.role==='silver'){const f=FN_IDS[Math.floor(Math.random()*FN_IDS.length)];p.hand.push(f);feed(`${lbl(p)}（銀髮族）入院，獲得功能卡「${FN[f].n}」`,'card');}
  }
  if(s.t==='train'){addStops(p,2,'ex');feed(`${lbl(p)} 被送進${s.n}強制特訓，要完成 2 張運動卡`,'warn',[],SP(`${s.n} 強制特訓`,p,[],'🏋️'));}
  if(s.t==='chance'||s.t==='fate')ev.card=s.t;
  if(s.t==='shop')ev.offers=shuffle(FN_IDS.slice()).slice(0,3);
  if(s.t==='dock')ev.dock=true;
  if(s.t==='prop'){
    const l=S.lands[s.id];
    if(l&&l.team!==p.team)ev.rent=true;
    if(s.fx==='pilgrim'){p.mods.push('half');feed(`${lbl(p)} 在${s.n}參拜，下次步數減半`,'');}
    else if(s.fx==='wind'){if(p.hand.includes('coat'))ev.spec='wind';else{p.mods.push('back');feed(`${lbl(p)} 在${s.n}遇到逆風，下次擲骰改成倒退`,'warn');}}
    else if(['climb','crab','stork','zen','contest','wave'].includes(s.fx))ev.spec=s.fx;
    if(s.fx==='wave')feed(`${s.n}波浪舞任務：全場所有玩家一起做三次波浪舞！`,'card',Object.keys(S.players));
  }
  p.ev=ev;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* returns result object; throws Error(msg) when invalid */
function hostAct(pid,a){
  if(a.type==='join'){
    const t=S.cfg.teams.find(x=>x.id===a.team);if(!t)throw new Error('找不到隊伍');if(!ROLES[a.role])throw new Error('請選角色');
    const name=String(a.name||'').trim().slice(0,12)||'玩家';
    const ex=S.players[pid];
    if(ex){ex.name=name;ex.team=t.id;ex.role=a.role;feed(`${lbl(ex)} 更新了資料`,'');return {};}
    S.players[pid]={id:pid,name,team:t.id,role:a.role,cash:S.cfg.start,route:'main',idx:0,pend:null,ev:null,stops:0,stopKind:'ex',mods:[],hand:[],lap:0,used:{},card:null,nobonusNext:false};
    feed(`${name} 加入${t.name}，角色：${ROLES[a.role].n}`,'');return {};
  }
  const p=S.players[pid];if(!p)throw new Error('請先加入遊戲');
  const s=sqOf(p),l=S.lands[s.id];
  const needEv=()=>{if(!p.ev)throw new Error('你目前不在需要處理的格子上');};
  switch(a.type){
    case 'roll':{
      if(S.phase==='lobby')throw new Error('遊戲還沒開始，等大螢幕按「開始遊戲」');
      {const nw=(typeof nowS==='function'?nowS():Date.now());if(p.startAt&&nw<p.startAt)throw new Error(`還沒輪到你出發，再等 ${Math.ceil((p.startAt-nw)/1000)} 秒`);}
      if(S.brk&&Date.now()<S.brk.until)throw new Error('現在是補水休息時間，休息結束再擲骰');
      if(p.pend)throw new Error(`請先前往 ${sqName(pendId(p))}`);
      if(p.stops>0)throw new Error('還在停跑，先完成運動卡');
      if(p.ev){const q=p.ev;if(q.hosp||q.rent||q.spec||q.card||q.dock)throw new Error('先把這一格處理完');p.ev=null;}
      if(p.card)throw new Error('先處理抽到的卡片');
      const d=Number(a.die);if(!(d>=1&&d<=6))throw new Error('點數要是 1 到 6');
      const take=k=>{const i=p.mods.indexOf(k);if(i<0)return false;p.mods.splice(i,1);return true;};
      if(p.mods.includes('even')){if(d%2){feed(`${lbl(p)} 擲出 ${d}，不是雙數，原地不動`,'warn');return {stay:true};}take('even');}
      let steps=d;const notes=[];
      if(take('fixed')){steps=1;notes.push('只能走 1 格');}
      else{
        take('pick');
        if(take('double')){steps*=2;notes.push('點數加倍');}
        if(take('half')){steps=Math.ceil(steps/2);notes.push('步數減半');}
        if(take('plus')){steps+=2;notes.push('碳板鞋 +2');}
        if(take('minus')){steps=Math.max(0,steps-2);notes.push('逆風 −2');}
      }
      const back=take('back');if(back)notes.push('倒退');
      if(steps===0){feed(`${lbl(p)} 擲出 ${d}（${notes.join('、')}），原地不動`,'warn');return {stay:true};}
      const t=stepTarget(p,back?-steps:steps);
      setTarget(p,t.route,t.idx,{pass:t.pass&&!back});
      feed(`${lbl(p)} 擲出 ${d}${notes.length?`（${notes.join('、')}）`:''}，前往 ${sqName(ROUTES[t.route][t.idx])}`,'move');
      return {};
    }
    case 'arrive':{
      if(!p.pend)throw new Error('你目前沒有要前往的格子');
      const want=pendId(p);if(a.sq!==want)throw new Error(`這是 ${SQ[a.sq]?sqName(a.sq):'未知格子'}，你要去的是 ${sqName(want)}`);
      const pe=p.pend;p.route=pe.route;p.idx=pe.idx;p.pend=null;
      feed(`${lbl(p)} 抵達 ${sqName(want)}${a.manual?'（手動確認）':''}`,'move');
      arriveEffects(p,pe);return {};
    }
    case 'hosp':{needEv();if(!p.ev.hosp)throw new Error('不用付醫藥費');
      if(a.how==='massage'){takeFn(p,'massage');feed(`${lbl(p)} 用按摩槍，免付醫藥費也不用打坐`,'card');}
      else{p.cash-=500;addStops(p,1,'zen');feed(`${lbl(p)} 付醫藥費 $500，要打坐 1 分鐘`,'warn');}
      p.ev.hosp=false;return {};}
    case 'buy':{needEv();if(s.t!=='prop')throw new Error('這一格不能買');if(l)throw new Error('這塊地已經有人買了');
      if(a.ex&&a.guo)useRole(p);
      const price=s.b-(a.ex?exDisc(s.b):0);if(p.cash<price)throw new Error(`現金不足，需要 ${fmt$(price)}`);
      p.cash-=price;S.lands[s.id]={team:p.team,owner:p.id,lvl:1};p.ev.upgraded=true;
      st().buys++;if(a.ex&&!a.guo)exc(p);feed(`${lbl(p)} 買下${s.n}，蓋了小木屋（${fmt$(price)}${a.ex?`，完成運動折 ${fmt$(exDisc(s.b))}`:''}）`,'money',[],Object.assign(SP(`${p.name} 在${s.n}蓋了小木屋`,p,[],'🏠'),{bld:1,from0:true}));return {};}
    case 'upgrade':{needEv();if(!l||l.team!==p.team)throw new Error('這不是你們隊的地');if(l.lvl>=3)throw new Error('已經是最高等級');if(p.ev.upgraded)throw new Error('每次停在這裡只能蓋一次，下次再來才能升級');
      if(a.ex&&a.guo)useRole(p);
      const cost=s.b*(l.lvl+1)-(a.ex?exDisc(s.b*(l.lvl+1)):0);if(p.cash<cost)throw new Error(`現金不足，需要 ${fmt$(cost)}`);
      p.cash-=cost;l.lvl++;p.ev.upgraded=true;st().ups++;if(a.ex&&!a.guo)exc(p);feed(`${lbl(p)} 把${s.n}從${BLD[l.lvl-1]}升級成${BLD[l.lvl]}（${fmt$(cost)}）`,'money',[],Object.assign(SP(`${s.n}：${BLD[l.lvl-1]} ➜ ${BLD[l.lvl]}`,p,[],'🏗️'),{bld:l.lvl}));return {};}
    case 'rent':{needEv();if(!p.ev.rent)throw new Error('不用付過路費');
      let amt=rentOf(s,l);let note='';
      if(a.how==='waiver'){takeFn(p,'waiver');amt=0;note='使用豁免卡';}
      else if(a.how==='arena'){if(p.role!=='tiyu'||!s.arena)throw new Error('只有體育生在運動場可以用');useRole(p);amt=0;note='體育生免付';}
      else{
        if(a.ex){if(a.guo)useRole(p);else exc(p);amt=Math.ceil(amt/2);note='完成運動打 5 折';}
        if(a.coach){takeFn(p,'coach');amt=Math.ceil(amt*0.8);note+=(note?'、':'')+'教練證照 8 折';}
        if(a.insure){if(rentOf(s,l)<=1000)throw new Error('過路費超過 $1,000 才能用保險');takeFn(p,'insure');amt=Math.ceil(amt/2);note+=(note?'、':'')+'保險付一半';}
      }
      const owner=l.team==='cpu'?null:S.players[l.owner];if(!note&&amt===rentOf(s,l))note=BLD[l.lvl];
      pay(p,owner,amt);p.ev.rent=false;const ss=st();ss.rent+=amt;ss.paid[p.id]=(ss.paid[p.id]||0)+amt;if(owner)ss.recv[owner.id]=(ss.recv[owner.id]||0)+amt;
      feed(`${lbl(p)} 付 ${fmt$(amt)} 過路費給 ${owner?lbl(owner):'電腦地主'}（${s.n}${note?'，'+note:''}）`,'money',owner?[owner.id]:[],SP(`過路費 ${fmt$(amt)}`,p,owner?[owner]:[],'💸'),owner&&amt?`💰 你收到 ${fmt$(amt)} 過路費：${p.name} 停在你的${s.n}`:null);return {};}
    case 'spec':{needEv();const fx=p.ev.spec||a.fx;
      if(fx==='test'||fx==='spring'){if(p.ev.bonusDone)throw new Error('這次已經領過了');if(s.fx!==fx)throw new Error('這一格沒有這個任務');const amt=fx==='test'?1500:500;p.cash+=amt;p.ev.bonusDone=true;if(fx==='test'&&!a.guo)exc(p);if(fx==='test'&&a.guo)useRole(p);feed(`${lbl(p)} 在${s.n}完成${fx==='test'?'體能測試':'溫泉療癒'}，領 ${fmt$(amt)}`,'money');return {};}
      if(!p.ev.spec)throw new Error('這一格沒有待處理的任務');
      if(((fx==='climb'&&!a.ok)||(fx==='crab'&&a.ok))&&p.ev.rent)throw new Error('先付完過路費再移動');
      if(fx==='contest'&&!S.players[a.opp])throw new Error('請選擇對手');
      if(a.ok&&a.guo)useRole(p);
      const ok=!!a.ok;p.ev.spec=null;
      if(ok&&!a.guo&&['climb','crab','stork','zen'].includes(fx))exc(p);
      if(fx==='climb'){if(ok)feed(`${lbl(p)} 完成負重登山`,'');else{feed(`${lbl(p)} 登山失敗，滑坡後退 3 格`,'warn');applyOps(p,[['back',3]]);}}
      else if(fx==='crab'){if(ok){feed(`${lbl(p)} 螃蟹走路成功，順著潮汐前進 3 格`,'move');applyOps(p,[['fwd',3]]);}else{p.cash-=500;feed(`${lbl(p)} 螃蟹走路失敗，付鞋子清洗費 $500`,'warn');}}
      else if(fx==='stork'){if(ok){p.cash+=1000;feed(`${lbl(p)} 黑面琵鷺立定成功，領 $1,000`,'money');}else{p.mods.push('half');feed(`${lbl(p)} 深陷泥淖，下次步數減半`,'warn');}}
      else if(fx==='zen'){if(ok){p.hand.push('waiver');feed(`${lbl(p)} 打坐完成，獲得豁免卡`,'card');}else{addStops(p,1,'ex');feed(`${lbl(p)} 不打坐，停一輪`,'warn');}}
      else if(fx==='wave'){Object.values(S.players).forEach(x=>exc(x));feed(`全場完成波浪舞！`,'',[],SP('全場波浪舞',p,others(p),'🌊'));}
      else if(fx==='wind'){if(a.coat){takeFn(p,'coat');feed(`${lbl(p)} 穿上抗風風衣，不受逆風影響`,'card');}else{p.mods.push('back');feed(`${lbl(p)} 遇到逆風，下次擲骰改成倒退`,'warn');}}
      else if(fx==='contest'){const o=S.players[a.opp];if(!o)throw new Error('請選擇對手');exc(p,o);if(ok){pay(o,p,500);feed(`${lbl(p)} 在${s.n}比賽贏了 ${lbl(o)}，對方付 $500`,'money',[o.id],SP(`對抗比賽：${p.name} 勝`,p,[o],'⚔️'),`比賽輸給 ${p.name}，付出 $500`);}else{pay(p,o,500);feed(`${lbl(o)} 在${s.n}比賽贏了 ${lbl(p)}，領 $500`,'money',[o.id],SP(`對抗比賽：${o.name} 勝`,p,[o],'⚔️'),`💰 你贏了比賽，收到 $500`);}}
      return {};}
    case 'draw':{needEv();if(!p.ev.card)throw new Error('這一格不用抽卡');if(p.card)throw new Error('已經抽過了');
      const deck=p.ev.card==='chance'?CHANCE:FATE;const n=p.role==='teen'?2:1;
      const ids=shuffle([...Array(deck.length).keys()]).slice(0,n);
      p.card={deck:p.ev.card,ids,pick:n===1?ids[0]:null};p.ev.card=null;st().cards++;
      feed(`${lbl(p)} 抽${p.card.deck==='chance'?'機會':'命運'}卡${n===2?'（青少年抽兩張選一張）':''}：${n===1?'「'+deck[ids[0]].n+'」':'「'+deck[ids[0]].n+'」或「'+deck[ids[1]].n+'」'}`,'card');return {};}
    case 'cardPick':{if(!p.card||p.card.pick!==null)throw new Error('沒有要選的卡');if(!p.card.ids.includes(a.id))throw new Error('選錯卡了');p.card.pick=a.id;const deck=p.card.deck==='chance'?CHANCE:FATE;feed(`${lbl(p)} 選擇「${deck[a.id].n}」`,'card');return {};}

const BOT_NAMES=['阿福','小美','阿強','小芳','大偉','阿珠','小傑','阿蓮'];
function addBot(tid){
  const ps=Object.values(S.players);
  const team=tid||[...S.cfg.teams].sort((a,b)=>ps.filter(p=>p.team===a.id).length-ps.filter(p=>p.team===b.id).length)[0].id;

const rnd=a=>a[Math.floor(Math.random()*a.length)];
function oppIds(p){return Object.values(S.players).filter(x=>x.team!==p.team).map(x=>x.id);}
/* decide one action for a computer player (play=true) or a taken-over human (play=false: only settle what is owed, never move) */
function autoAction(p,play){
  const s=sqOf(p),l=S.lands[s.id],e=p.ev;
  if(p.card){const deck=p.card.deck==='chance'?CHANCE:FATE;
    if(p.card.pick===null)return [{type:'cardPick',id:rnd(p.card.ids)},3];
    const c=deck[p.card.pick];const o=c.ex?(play&&Math.random()<.75?0:c.o.length-1):0;
    return [{type:'cardOpt',o,target:rnd(oppIds(p))||null,sq:rnd(ROUTES.main)},play?6:2];}
  if(p.pend)return play?[{type:'arrive',sq:pendId(p)},4]:null;
  if(e){
    if(e.hosp)return [{type:'hosp'},4];
    if(e.rent)return [{type:'rent',how:'cash'},4];
    if(e.spec){const ok=play?Math.random()<.75:false;return [{type:'spec',ok,opp:rnd(oppIds(p)),coat:play&&p.hand.includes('coat')},play?25:2];}
    if(e.card)return [{type:'draw'},4];
    if(e.dock)return [{type:'dock'},play?6:2];
    if(play){
      if(s.t==='port'&&!e.botPort){e.botPort=true;if(Math.random()<.35&&p.cash>2500)return [{type:'port'},20];}
      if(s.t==='prop'&&!l&&p.cash>=s.b+1500&&Math.random()<.8)return [{type:'buy',ex:Math.random()<.5},20];
      if(s.t==='prop'&&l&&l.team===p.team&&l.lvl<3&&!e.upgraded&&p.cash>=s.b*(l.lvl+1)+2500&&Math.random()<.6)return [{type:'upgrade'},20];
      if(e.offers&&!e.bought&&!e.botShop){e.botShop=true;const f=e.offers.find(x=>FN[x].p+2500<=p.cash);if(f&&Math.random()<.4)return [{type:'shopBuy',i:e.offers.indexOf(f)},6];}
    }
    return [{type:'evDone'},play?5:2];
  }
  if(p.stops>0)return play?[{type:'stopDone'},30]:null;
  return play?[{type:'roll',die:1+Math.floor(Math.random()*6)},25+Math.random()*25]:null;
}
function hostTick(){
  if(role!=='host'||!S||!isHostActive)return;
  if(S.refs){let ch=false;for(const [k,r] of Object.entries(S.refs)){if(Date.now()-r.at>600000||!S.players[r.by]){delete S.refs[k];ch=true;}}if(ch)broadcast();}
  const running=!!S.timer.endAt&&!(S.brk&&Date.now()<S.brk.until);let changed=false;
  for(const p of Object.values(S.players)){
    if(p.bot){if(!running||Date.now()<(p.nextAt||0))continue;const a=autoAction(p,true);if(!a)continue;const r=hostDo(p.id,a[0]);p.nextAt=Date.now()+(r.err?8000:a[1]*1000);changed=true;continue;}
    const off=!isOnline(p.id),longOff=off&&Date.now()-(p.offSince||Date.now())>=TAKEOVER_MS;
    if(off&&!p.offSince){p.offSince=Date.now();changed=true;}
    if(!off&&p.offSince){p.offSince=null;if(p.auto){p.auto=false;feed(`${lbl(p)} 回來了，結束電腦代管`,'',[p.id]);}changed=true;}
    if(longOff){if(!p.auto){p.auto=true;feed(`${lbl(p)} 離線超過 2 分鐘，電腦先代管（只代付該付的，不會移動）`,'warn');changed=true;}
      const a=autoAction(p,false);if(a&&Date.now()>=(p.nextAt||0)){hostDo(p.id,a[0]);p.nextAt=Date.now()+a[1]*1000;changed=true;}}
  }
  if(changed)broadcast();
}
